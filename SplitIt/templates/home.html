<h1>SplitIt Project</h1>

<a href="{%url 'SplitIt:new'%}">새글 작성</a>

<br><br>

<div style="margin-top: 10px; margin-bottom: 30px;">
    <a href="{% url 'SplitIt:home' %}" style="padding: 6px 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; color: #495057; text-decoration: none; border-radius: 20px; font-weight: bold; margin-right: 10px;">
        📋 전체
    </a>
    
    <a href="{% url 'SplitIt:home' %}?status=recruiting" style="padding: 6px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 20px; font-weight: bold;">
        👀 모집중
    </a>
</div>

<br><br>

{% for post in posts.all %}
    
    {% if post.status == '모집중' %}
        <span style="color: white; background-color: #007bff; padding: 3px 8px; border-radius: 5px; font-size: 14px; font-weight: bold;">
            모집중
        </span>
    {% else %}
        <span style="color: white; background-color: #6c757d; padding: 3px 8px; border-radius: 5px; font-size: 14px; font-weight: bold;">
            모집완료
        </span>
    {% endif %}

    <h3 style="margin-top: 5px; margin-bottom: 5px;">
        <a href="{% url 'SplitIt:detail' post.id %}" style="text-decoration: none; color: black;">
            {{post.title}}
        </a>
    </h3>

    <div style="color: gray; font-size: 14px; margin-bottom: 20px;">
        {{post.created_at}}
    </div>

    <hr style="border: 0; height: 1px; background: #eee;">

{% endfor %}
